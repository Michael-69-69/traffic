services:
  - type: web
    name: traffic-analysis
    env: python
    region: singapore
    plan: free
    healthCheckPath: /health
    runtime: python-3.9
    buildCommand: "pip install -r requirements.txt && python model_converter.py"
    startCommand: "gunicorn -w 1 -b 0.0.0.0:$PORT app:app"
    envVars:
      - key: USE_MODELS
        value: "true"
      - key: BASE_DIR
        value: "/app"
      - key: PORT
        value: "10000"
      - key: CAMERA_URL_TEMPLATE
        value: "https://giaothong.hochiminhcity.gov.vn:8007/Render/CameraHandler.ashx?id={camera_id}"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: TF_FORCE_GPU_ALLOW_GROWTH
        value: "true"
      - key: TF_MEMORY_ALLOCATION
        value: "512MB"